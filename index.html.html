<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you tota</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cairo:wght@400;600&display=swap');

  :root{
    --rose: #b23a5c;
    --rose-deep: #7a2440;
    --cream: #fbf3ef;
    --gold: #c99a5b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #fdf6f3 0%, #f5e3e7 55%, #ecd0d9 100%);
    font-family: 'Cairo', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 60px 50px;
    animation: rise 1.1s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .heart-mark {
    width: 42px;
    height: 42px;
    margin: 0 auto 22px;
    color: var(--rose);
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    color: var(--rose-deep);
    margin: 0;
    line-height: 1.15;
    letter-spacing: 0.5px;
  }

  .headline .name {
    display: block;
    font-size: clamp(3rem, 8vw, 5.5rem);
    color: var(--gold);
    margin-top: 6px;
  }

  .underline {
    width: 90px;
    height: 2px;
    background: var(--gold);
    margin: 26px auto;
    opacity: 0.7;
  }

  .sub {
    font-size: 1.05rem;
    color: #8a5566;
    letter-spacing: 1px;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    bottom: -10%;
    color: var(--rose);
    opacity: 0.55;
    animation-name: float;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }

  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="card">
      <svg class="heart-mark" viewBox="0 0 32 29" fill="currentColor">
        <path d="M16 29C16 29 0 19.5 0 9.5C0 3.6 4.4 0 9.2 0C12.1 0 14.6 1.6 16 4C17.4 1.6 19.9 0 22.8 0C27.6 0 32 3.6 32 9.5C32 19.5 16 29 16 29Z"/>
      </svg>
      <h1 class="headline">I love you<span class="name">tota</span></h1>
      <div class="underline"></div>
      <p class="sub">love you forever 💕</p>
    </div>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    const heartPaths = 'M16 29C16 29 0 19.5 0 9.5C0 3.6 4.4 0 9.2 0C12.1 0 14.6 1.6 16 4C17.4 1.6 19.9 0 22.8 0C27.6 0 32 3.6 32 9.5C32 19.5 16 29 16 29Z';

    function spawnHeart() {
      const h = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      h.setAttribute('viewBox', '0 0 32 29');
      h.classList.add('heart');
      const size = 12 + Math.random() * 22;
      h.style.width = size + 'px';
      h.style.height = size + 'px';
      h.style.left = Math.random() * 100 + '%';
      const duration = 6 + Math.random() * 6;
      h.style.animationDuration = duration + 's';

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', heartPaths);
      path.setAttribute('fill', 'currentColor');
      h.appendChild(path);

      stage.appendChild(h);
      setTimeout(() => h.remove(), duration * 1000);
    }

    setInterval(spawnHeart, 500);
    for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 200);
  </script>

</body>
</html>
